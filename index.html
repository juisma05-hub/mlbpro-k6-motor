<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MLBPro · Predicción K6</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: linear-gradient(135deg, #0d0a06 0%, #1a1410 50%, #0d0a06 100%);
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0;
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
  }

  .logo-section {
    margin-bottom: 40px;
  }

  .logo-circle {
    width: 180px;
    height: 180px;
    margin: 0 auto 30px;
    border: 3px solid #c9a94d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, rgba(201, 169, 77, 0.1), transparent);
  }

  .logo-circle svg {
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 0 8px rgba(201, 169, 77, 0.3));
  }

  .title {
    font-size: 42px;
    font-weight: 900;
    margin: 0 0 10px;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ffffff 0%, #c9a94d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    color: #8b949e;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 30px;
    font-weight: 600;
  }

  .tagline {
    font-size: 13px;
    color: #c9a94d;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .author {
    font-size: 12px;
    color: #6e7681;
    font-style: italic;
    margin-bottom: 50px;
  }

  .cta-button {
    display: inline-block;
    padding: 18px 50px;
    background: linear-gradient(135deg, #c9a94d 0%, #a68a3a 100%);
    color: #1a1410;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(201, 169, 77, 0.2);
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(201, 169, 77, 0.35);
    background: linear-gradient(135deg, #d4b85f 0%, #b39a4a 100%);
  }

  .cta-button:active {
    transform: translateY(0);
  }

  .footer-info {
    padding: 20px;
    text-align: center;
    font-size: 11px;
    color: #6e7681;
    border-top: 1px solid #30363d;
  }

  .status-badge {
    display: inline-block;
    background: #0d3a2c;
    color: #3fb950;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  @media (max-width: 600px) {
    .title { font-size: 36px; }
    .subtitle { font-size: 12px; }
    .logo-circle { width: 150px; height: 150px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-section">
    <div class="logo-circle">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Beisbol base -->
        <circle cx="100" cy="100" r="90" fill="none" stroke="#c9a94d" stroke-width="2"/>
        
        <!-- Costuras del beisbol -->
        <path d="M 60 80 Q 100 50 140 80" fill="none" stroke="#c9a94d" stroke-width="2" stroke-linecap="round"/>
        <path d="M 60 120 Q 100 150 140 120" fill="none" stroke="#c9a94d" stroke-width="2" stroke-linecap="round"/>
        
        <!-- K grande en centro -->
        <text x="100" y="115" font-size="60" font-weight="900" fill="#c9a94d" text-anchor="middle" font-family="Arial, sans-serif">K</text>
        
        <!-- Número 6 pequeño -->
        <text x="130" y="90" font-size="24" font-weight="700" fill="#c9a94d" text-anchor="middle">6</text>
      </svg>
    </div>

    <h1 class="title">MLBPro</h1>
    <p class="tagline">SPORT TRADITION</p>
    <p class="subtitle">PREDICCIÓN</p>
    <p style="font-size: 13px; color: #8b949e; margin: 20px 0 0; letter-spacing: 1px;">ANÁLISIS · PROYECCIÓN · PRECISIÓN</p>
    <p class="author">by Juan Isidro Pérez</p>
  </div>

  <div class="status-badge">🎮 JUEGOS EN VIVO</div>

  <a href="juegos-hoy.html" class="cta-button">
    <span>⚾</span>
    <span>VER JUEGOS DE HOY</span>
  </a>
</div>

<div class="footer-info">
  <p>K6 Motor · Análisis de ponches en vivo</p>
  <p style="margin: 8px 0 0; color: #30363d;">v1.0.0 · Temporada 2026</p>
</div>
</body>
</html>
