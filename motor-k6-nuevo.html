<script>
/* ============================================================
   PRÓLOGO — k6-motor-nuevo.html (script inline)
   ============================================================
   QUÉ ES:
     Pantalla "K6 · Motor Nuevo (DataPro)". Jala el schedule de hoy,
     para cada juego calcula el K6 proyectado de ambos pitchers
     probables (vía motor-k6-nuevo.js) usando sus últimos 5 starts, lo
     compara contra la línea de mercado de ponches, y si el juego está
     en vivo agrega una caja de proyección en tiempo real basada en el
     boxscore.

   ORDEN DE CARGA (no cambiar, cada uno depende del anterior):
     1. mlb-routes.js           (MLB_ROUTES.WORKER_BASE — proxy)
     2. arsenal-master.js       (ARSENAL_MASTER_2026 global)
     3. umpires-master.js       (UMPIRES_MASTER_2026 global)
     4. park-factors.js         (PARK_FACTORS_2026 global)
     5. jalar-linea-ponches.js  (jalarLineasPonches, lineaPonchesBuscarPitcher)
     6. jalar-ultimos5.js       (jalarUltimos5)
     7. motor-k6-nuevo.js       (calcularK6, compararConLinea,
                                 ipRealDesdeBeisbol, redondearParaMostrar)
     8. este script inline

   FUNCIONES GLOBALES USADAS (definidas en los scripts de arriba, NO
   en este archivo — este archivo no las reimplementa):
     MLB_ROUTES.WORKER_BASE, ARSENAL_MASTER_2026, UMPIRES_MASTER_2026,
     PARK_FACTORS_2026, jalarLineasPonches(), lineaPonchesBuscarPitcher(),
     jalarUltimos5(), calcularK6(), compararConLinea(),
     ipRealDesdeBeisbol(), redondearParaMostrar().

   CACHÉS / localStorage:
     Este archivo NO lee ni escribe localStorage directamente. Todo el
     estado vive en memoria de la corrida (variables locales del click
     handler); si algún script cargado arriba usa caché propia
     (ej. líneas de mercado), es responsabilidad de ESE script, no de
     este HTML.

   QUIÉN LO LLAMA:
     Standalone — se abre directo como página (K6 Motor Nuevo), enlazada
     desde k6-test.html ("← Volver a K6 · Ponches") y viceversa.

   LÓGICA PREGAME (juego no está "Live"):
     Se calcula K6 proyectado de cada pitcher probable con calcularK6()
     usando sus últimos 5 starts, se compara contra la línea de mercado
     si existe, y se muestra la tarjeta normal. NO se llama a
     jalarEnVivoPitcher() ni aparece la caja "EN VIVO" — eso solo pasa
     si g.status.abstractGameState === "Live".

   LÓGICA EN VIVO (juego con abstractGameState === "Live"):
     Para cada pitcher probable con id real, se pide el feed en vivo del
     juego (jalarEnVivoPitcher, endpoint /feed/live) y se lee su IP/K
     reales SI el objeto de ese jugador trae stats.pitching (dentro de
     liveData.boxscore.teams). El estado de continuidad (sigue_en_juego)
     se determina así:
       1. Se identifica a qué equipo pertenece el pitcher consultado
          (away/home), según el bloque boxTeams donde se encontró.
       2. Se lee liveData.linescore.isTopInning y
          liveData.linescore.defense.pitcher.id.
       3. Se determina el equipo defensivo real: isTopInning===true →
          defiende home; isTopInning===false → defiende away.
       4. Solo si el equipo del pitcher consultado ES el equipo
          defensivo se compara defense.pitcher.id contra pitcherId
          (igual → true, distinto → false).
       5. Si el equipo del pitcher está BATEANDO (no es el equipo
          defensivo), sigue_en_juego queda null — nunca false — porque
          en ese instante defense.pitcher.id pertenece al pitcher rival
          y no dice nada sobre si el pitcher consultado sigue siendo el
          titular de su equipo.
       6. Si isTopInning no es boolean, o no hay defense.pitcher.id
          numérico real, sigue_en_juego queda null (no se puede
          determinar, no se inventa ni continuidad ni reemplazo).
     proyeccionEnVivo() decide qué mostrar según sigue_en_juego Y según
     si hay un ritmo K6 confirmado:
       true + k6_proyectado_preciso real → proyecta K actuales + K
               restante hasta el marco K6 (mismo ritmo K/IP de
               calcularK6, IP restantes hasta 6.0). Caja
               "🔴 PROYECCIÓN EN VIVO".
       true + k6_proyectado_preciso null → sigue lanzando pero el motor
               no tiene ritmo K6 confirmado (ej. sin starts calificados);
               NO se inventa una proyección. Caja
               "🟡 ACTIVO — SIN RITMO K6 CONFIRMADO", solo K/IP reales.
       false → NO proyecta entradas futuras. Muestra el K real como
               total final. Caja "✅ SALIDA CONFIRMADA".
       null  → NO proyecta entradas futuras (no se inventa que sigue
               lanzando). Muestra K/IP reales tal cual. Caja
               "⏳ ESTADO NO CONFIRMADO".
     En los cuatro casos el K real y las IP reales del feed se
     conservan y se muestran — lo único que cambia es si se agrega o
     no una proyección de entradas futuras.

   QUÉ NO TOCA (fuera de alcance de esta corrección):
     calcularK6() y su ponderación de capas (motor-k6-nuevo.js), el
     cálculo/lectura de línea de mercado (jalar-linea-ponches.js), la
     lógica de últimos 5 starts (jalar-ultimos5.js), el diseño/CSS, ni
     la estructura de tarjetas (un juego = una tarjeta con los dos
     pitchers adentro).

   FECHA:
     13 jul 2026.

   ESTADO:
     NO_CONFIRMADO — correcciones aplicadas por lectura de código y
     probadas con fetch simulado en Node dentro de esta sesión (fecha
     ET, pitcher activo con y sin ritmo K6 confirmado, pitcher
     reemplazado vía defense.pitcher.id con equipo defensivo correcto,
     pitcher de un equipo bateando → null en vez de false, estado no
     confirmado, pregame sin caja en vivo). Pendiente de prueba real en
     el navegador con un juego en vivo real de MLB Stats API, para
     confirmar que liveData.linescore.isTopInning y
     liveData.linescore.defense.pitcher.id existen y son fiables en el
     feed real.
   ============================================================ */

  var consoleEl = document.getElementById("console");
  var listaEl = document.getElementById("lista");
  function log(t){ var d=document.createElement("div"); d.textContent=t; consoleEl.appendChild(d); consoleEl.scrollTop=consoleEl.scrollHeight; }

  // Fecha de HOY en America/New_York (maneja horario de verano solo,
  // vía Intl.DateTimeFormat — no un offset fijo de horas que se
  // desalinea en DST o según dónde esté físicamente el dispositivo).
  // en-CA da directamente el formato YYYY-MM-DD.
  function hoyISO(){
    var fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
    });
    return fmt.format(new Date());
  }

  // ── UN pitcher, dentro de la tarjeta compartida del juego ──
  // ── NUEVO: si el juego está en curso, trae los ponches REALES que ya
  // lleva el pitcher en este mismo juego, y proyecta lo que falta según
  // su ritmo de K6. Igual lógica que la app de referencia
  // ("PROYECCIÓN FINAL EN VIVO: K actuales + K proy · IP restantes"). ──
  async function jalarEnVivoPitcher(gamePk, pitcherId){
    try {
      var url = "https://statsapi.mlb.com/api/v1.1/game/" + gamePk + "/feed/live";
      var resp = await fetch(MLB_ROUTES.WORKER_BASE + encodeURIComponent(url));
      if (!resp.ok) return null;
      var data = await resp.json();
      var boxTeams = (data.liveData && data.liveData.boxscore && data.liveData.boxscore.teams)
        ? data.liveData.boxscore.teams : null;
      if (!boxTeams) return null;
      var teams = ["away", "home"];
      for (var t = 0; t < teams.length; t++) {
        var equipoPitcher = teams[t]; // "away" u "home" — el bloque exacto donde se encontró
        var players = boxTeams[equipoPitcher] ? boxTeams[equipoPitcher].players : null;
        if (!players) continue;
        var key = "ID" + pitcherId;
        if (players[key] && players[key].stats && players[key].stats.pitching) {
          var st = players[key].stats.pitching;
          var ipReal = ipRealDesdeBeisbol(st.inningsPitched);
          var kActuales = st.strikeOuts !== undefined ? Number(st.strikeOuts) : null;
          if (ipReal === null || kActuales === null) return null;

          // Estado real de continuidad: liveData.linescore.defense.pitcher.id
          // es el ID del pitcher en el montículo AHORA MISMO, pero eso solo
          // es comparable contra pitcherId si el equipo de ESE pitcher es el
          // que está a la defensiva en este instante. Si su equipo está
          // bateando, defense.pitcher.id pertenece al pitcher RIVAL — no se
          // puede usar esa comparación para decir "reemplazado".
          //
          // Equipo defensivo real, vía isTopInning:
          //   isTopInning === true  → away batea, HOME defiende.
          //   isTopInning === false → home batea, AWAY defiende.
          //   no boolean            → no se puede determinar, todo queda null.
          var linescore = (data.liveData && data.liveData.linescore) ? data.liveData.linescore : null;
          var isTopInning = (linescore && typeof linescore.isTopInning === "boolean") ? linescore.isTopInning : null;
          var pitcherActualId = (linescore && linescore.defense && linescore.defense.pitcher &&
              typeof linescore.defense.pitcher.id !== "undefined")
            ? Number(linescore.defense.pitcher.id)
            : null;

          var sigueEnJuego;
          if (isTopInning === null || pitcherActualId === null || !Number.isFinite(pitcherActualId)) {
            // Sin inning confirmado o sin ID de pitcher defensivo confiable:
            // no se puede saber, no se inventa continuidad ni reemplazo.
            sigueEnJuego = null;
          } else {
            var equipoDefensivo = isTopInning ? "home" : "away";
            if (equipoDefensivo !== equipoPitcher) {
              // El equipo de este pitcher está BATEANDO ahora mismo —
              // defense.pitcher.id pertenece al rival, no es comparable.
              // Nunca se marca como reemplazado en este caso.
              sigueEnJuego = null;
            } else {
              // El equipo de este pitcher SÍ está a la defensiva: la
              // comparación de ID es válida.
              sigueEnJuego = (pitcherActualId === Number(pitcherId));
            }
          }

          return {
            en_juego: true,
            ip_actual: ipReal,
            ip_actual_texto: st.inningsPitched,
            k_actual: kActuales,
            sigue_en_juego: sigueEnJuego
          };
        }
      }
      return null;
    } catch(e) { return null; }
  }

  // Combina lo real (juego en curso) con la proyección del motor para lo
  // que falta — SOLO si el pitcher confirmadamente sigue lanzando. Usa
  // el mismo ritmo K/IP que ya calculó calcularK6 en base a los últimos
  // starts, aplicado solo a las entradas que faltan.
  //
  // Reglas de sigue_en_juego (ver jalarEnVivoPitcher):
  //   true  → si hay ritmo K6 confirmado (k6_proyectado_preciso !== null),
  //           proyecta K actuales + K restante hasta el marco K6, estado
  //           "EN_CURSO". Si NO hay ritmo K6 confirmado, no se inventa
  //           una proyección: estado "PROYECCION_NO_CONFIRMADA", solo
  //           K/IP reales.
  //   false → YA NO proyecta entradas futuras. Total = K real, estado
  //           "SALIDA_CONFIRMADA".
  //   null  → no se pudo confirmar si sigue lanzando. NO se inventa
  //           continuidad: no proyecta entradas futuras, estado
  //           "NO_CONFIRMADO". Se sigue mostrando el K real y las IP
  //           reales, que sí son datos confirmados por el boxscore.
  function proyeccionEnVivo(resultadoMotor, enVivo){
    if (!enVivo || !enVivo.en_juego) return null;

    var base = {
      k_actual: enVivo.k_actual,
      ip_actual_texto: enVivo.ip_actual_texto
    };

    if (enVivo.sigue_en_juego === true) {
      if (resultadoMotor.k6_proyectado_preciso === null) {
        // Sigue lanzando de verdad, pero el motor no tiene un ritmo K6
        // confirmado para proyectar (por ejemplo, sin starts calificados
        // recientes). No se inventa una proyección de entradas futuras:
        // se muestran K/IP reales tal cual, con estado explícito.
        base.estado = "PROYECCION_NO_CONFIRMADA";
        base.total_en_vivo = enVivo.k_actual;
        return base;
      }
      var ritmoK6 = resultadoMotor.k6_proyectado_preciso; // K por cada 6 IP, ya con todos los factores
      var ritmoPorIP = ritmoK6 / 6;
      // IP restantes esperadas: hasta 6.0 IP (marco del K6), nunca negativo
      var ipRestantes = Math.max(0, 6 - enVivo.ip_actual);
      var kProyRestante = ritmoPorIP * ipRestantes;
      var totalPreciso = enVivo.k_actual + kProyRestante;
      base.estado = "EN_CURSO";
      base.k_proy_restante = redondearParaMostrar(kProyRestante, 1);
      base.ip_restantes = redondearParaMostrar(ipRestantes, 1);
      base.total_en_vivo = redondearParaMostrar(totalPreciso, 1);
      return base;
    }

    if (enVivo.sigue_en_juego === false) {
      base.estado = "SALIDA_CONFIRMADA";
      base.total_en_vivo = enVivo.k_actual;
      return base;
    }

    // enVivo.sigue_en_juego === null: no confirmado, no se inventa que
    // sigue lanzando. Se devuelven los reales, sin proyección futura.
    base.estado = "NO_CONFIRMADO";
    return base;
  }

  function bloquePitcherHtml(equipoNombre, pitcherNombre, resultado, lineaMercado, enVivo){
    var k6Val, k6Badge;
    if (resultado.k6_proyectado === null) {
      k6Val = "N/C";
      k6Badge = '<span class="badge warn">'+(resultado.motivo||"NO_CONFIRMADO")+'</span>';
    } else {
      // FIX: k6_proyectado ya viene redondeado a 1 decimal SOLO para mostrar
      // (motor-k6-nuevo.js lo separa de k6_proyectado_preciso, que es el
      // que se usa para comparar contra la linea, nunca este).
      k6Val = resultado.k6_proyectado;
      var nSinConfirmar = resultado.capas_sin_confirmar ? resultado.capas_sin_confirmar.length : 0;
      k6Badge = nSinConfirmar === 0
        ? '<span class="badge ok">CONFIRMADO</span>'
        : '<span class="badge warn">'+nSinConfirmar+' capa(s) sin confirmar: '+resultado.capas_sin_confirmar.join(", ")+'</span>';
    }

    // NUEVO: caja "EN VIVO" — solo aparece si el juego ya está en curso y
    // se pudo leer el boxscore real de este pitcher. El contenido exacto
    // depende del estado real de continuidad (ver proyeccionEnVivo):
    // proyecta entradas futuras SOLO si sigue confirmadamente lanzando.
    var enVivoHtml = '';
    var proyVivo = proyeccionEnVivo(resultado, enVivo);
    if (proyVivo) {
      if (proyVivo.estado === "EN_CURSO") {
        enVivoHtml = '<div class="envivo-box">'+
          '<div class="envivo-titulo">🔴 PROYECCIÓN EN VIVO</div>'+
          '<div class="envivo-total">'+proyVivo.total_en_vivo+'</div>'+
          '<div class="envivo-detalle">'+proyVivo.k_actual+' K actuales + '+proyVivo.k_proy_restante+' proy · '+proyVivo.ip_restantes+' IP restantes ('+proyVivo.ip_actual_texto+' IP lanzadas)</div>'+
        '</div>';
      } else if (proyVivo.estado === "SALIDA_CONFIRMADA") {
        enVivoHtml = '<div class="envivo-box">'+
          '<div class="envivo-titulo">✅ SALIDA CONFIRMADA</div>'+
          '<div class="envivo-total">'+proyVivo.total_en_vivo+'</div>'+
          '<div class="envivo-detalle">'+proyVivo.k_actual+' K reales (final) · '+proyVivo.ip_actual_texto+' IP lanzadas — ya no está en el montículo, sin proyección de entradas futuras</div>'+
        '</div>';
      } else if (proyVivo.estado === "PROYECCION_NO_CONFIRMADA") {
        enVivoHtml = '<div class="envivo-box">'+
          '<div class="envivo-titulo">🟡 ACTIVO — SIN RITMO K6 CONFIRMADO</div>'+
          '<div class="envivo-total">'+proyVivo.total_en_vivo+'</div>'+
          '<div class="envivo-detalle">'+proyVivo.k_actual+' K reales hasta ahora · '+proyVivo.ip_actual_texto+' IP lanzadas — sigue en el montículo, pero el motor no tiene un ritmo K6 confirmado para proyectar entradas futuras</div>'+
        '</div>';
      } else {
        // NO_CONFIRMADO: no se inventa continuidad; se muestran solo los
        // reales confirmados por el boxscore, sin proyectar entradas.
        enVivoHtml = '<div class="envivo-box">'+
          '<div class="envivo-titulo">⏳ ESTADO NO CONFIRMADO</div>'+
          '<div class="envivo-total">'+proyVivo.k_actual+'</div>'+
          '<div class="envivo-detalle">'+proyVivo.k_actual+' K reales hasta ahora · '+proyVivo.ip_actual_texto+' IP lanzadas — no se pudo confirmar si sigue en el montículo, sin proyección de entradas futuras</div>'+
        '</div>';
      }
    }

    var lineas = '<div class="lineas">'+
      '<div class="lbox nuevo"><div class="lbl">K6 DATAPRO (nuevo)</div><div class="val">'+k6Val+'</div></div>'+
      '<div class="lbox mercado"><div class="lbl">LÍNEA MERCADO</div><div class="val">'+(lineaMercado!==null?lineaMercado:"N/C")+'</div></div>'+
    '</div>';

    // NUEVO: comparacion con margen (con el numero PRECISO, no el redondeado)
    var margenHtml = '';
    if (resultado.k6_proyectado_preciso !== null && lineaMercado !== null && typeof compararConLinea === "function") {
      var comp = compararConLinea(resultado.k6_proyectado_preciso, lineaMercado);
      if (comp.lectura !== "NO_CONFIRMADO") {
        margenHtml = '<div class="margen-chip '+comp.lectura+'">'+comp.texto+' ('+(comp.diferencia_display>=0?'+':'')+comp.diferencia_display+')</div>';
      }
    }

    var muestraWarn = '';
    if (resultado.muestra_status === "MUESTRA_PEQUENA") {
      muestraWarn = '<div><span class="badge warn">MUESTRA PEQUEÑA: solo '+resultado.n_starts_usados+' start(s) calificado(s) — leer con mucha cautela</span></div>';
    }

    var u5html = '';
    if (resultado.capas && resultado.capas.base_volumen && resultado.capas.base_volumen.status !== "NO_CONFIRMADO") {
      var bv = resultado.capas.base_volumen;
      u5html = '<div class="ultimos5"><div class="u5hdr">ÚLTIMOS STARTS (K6 escalado por start — '+
        resultado.n_starts_usados+' usados)</div>';
      u5html += '<div class="u5row"><span>K6 promedio (escalado K×6/IP)</span><b>'+resultado.base_k_real+'</b></div>';
      // FIX: usar los campos _display (ya redondeados para leer), no los
      // crudos sin redondear — antes salia "15.833333333333334".
      if (bv.pitches_promedio_display !== null) {
        u5html += '<div class="u5row"><span>Pitcheos promedio</span><b>'+bv.pitches_promedio_display+'</b></div>';
      }
      if (bv.pitches_por_k_display !== null) {
        u5html += '<div class="u5row"><span>Pitcheos por K</span><b>'+bv.pitches_por_k_display+'</b></div>';
      }
      u5html += '</div>';
    }

    return '<div class="pitcher-bloque">'+
      '<div class="pitcher-nombre">⚾ '+pitcherNombre+' <span class="equipo">('+equipoNombre+')</span></div>'+
      lineas + k6Badge + margenHtml + muestraWarn + enVivoHtml + u5html +
    '</div>';
  }

  // ── LA tarjeta del juego, con los 2 pitchers juntos adentro ──
  function tarjetaJuegoHtml(matchup, venue, bloqueAwayHtml, bloqueHomeHtml){
    return '<div class="juego">'+
      '<div class="matchup">'+matchup+'</div>'+
      '<div class="estadio">'+venue+'</div>'+
      bloqueAwayHtml + bloqueHomeHtml +
    '</div>';
  }

  document.getElementById("goCargar").addEventListener("click", async function(){
    var btn = this; btn.disabled = true; btn.textContent = "TRABAJANDO…";
    consoleEl.textContent = ""; listaEl.innerHTML = "";
    try {
      log("Trayendo líneas de ponches...");
      var lineasCache = null;
      try { lineasCache = await jalarLineasPonches(log); }
      catch (el) { log("AVISO líneas: " + (el && el.message ? el.message : el)); lineasCache = null; }

      log("Trayendo juegos de hoy...");
      var hoy = hoyISO();
      // Año MLB derivado de la MISMA fecha ET que usa el schedule — no
      // new Date().getFullYear() por separado, que podía desalinearse
      // del año real de MLB cerca de fin/inicio de año o por zona
      // horaria del dispositivo.
      var anioMLB = Number(hoy.slice(0, 4));
      var mlbUrl = "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date="+hoy+"&hydrate=probablePitcher";
      var resp = await fetch(MLB_ROUTES.WORKER_BASE + encodeURIComponent(mlbUrl));
      if (!resp.ok) throw new Error("Schedule HTTP " + resp.status);
      var data = await resp.json();
      var games = (data.dates && data.dates[0]) ? data.dates[0].games : [];
      log("Juegos hoy: " + games.length);
      if (games.length === 0) { log("No hay juegos hoy."); return; }

      var html = "";
      for (var i = 0; i < games.length; i++) {
        var g = games[i];
        var venue = g.venue ? g.venue.name : "";
        var away = (g.teams && g.teams.away && g.teams.away.team) ? g.teams.away.team.name : "?";
        var home = (g.teams && g.teams.home && g.teams.home.team) ? g.teams.home.team.name : "?";
        var pAwayId = (g.teams && g.teams.away && g.teams.away.probablePitcher) ? g.teams.away.probablePitcher.id : null;
        var pAwayName = (g.teams && g.teams.away && g.teams.away.probablePitcher) ? g.teams.away.probablePitcher.fullName : "TBD";
        var pHomeId = (g.teams && g.teams.home && g.teams.home.probablePitcher) ? g.teams.home.probablePitcher.id : null;
        var pHomeName = (g.teams && g.teams.home && g.teams.home.probablePitcher) ? g.teams.home.probablePitcher.fullName : "TBD";

        // NUEVO: si el juego esta en curso, se busca el boxscore en vivo
        // para sacar los K reales que ya lleva cada pitcher.
        var estadoJuego = g.status && g.status.abstractGameState ? g.status.abstractGameState : "";
        var juegoEnVivo = estadoJuego === "Live";
        var enVivoAway = null, enVivoHome = null;
        if (juegoEnVivo && g.gamePk) {
          if (pAwayId) enVivoAway = await jalarEnVivoPitcher(g.gamePk, pAwayId);
          if (pHomeId) enVivoHome = await jalarEnVivoPitcher(g.gamePk, pHomeId);
        }

        // --- Pitcher visitante (away) enfrenta al lineup de casa (home) ---
        var lineaObjAway = lineasCache ? lineaPonchesBuscarPitcher(pAwayName) : null;
        var lineaMercadoAway = (lineaObjAway && lineaObjAway.total_k !== null && lineaObjAway.total_k !== undefined) ? lineaObjAway.total_k : null;
        log("Línea K de mercado para " + pAwayName + ": " + (lineaMercadoAway !== null ? lineaMercadoAway : "N/C"));

        var bloqueAway;
        if (!pAwayId) {
          bloqueAway = bloquePitcherHtml(away, "TBD", {k6_proyectado:null, k6_proyectado_preciso:null, motivo:"SIN_PITCHER_PROBABLE"}, lineaMercadoAway, null);
        } else {
          try {
            log("Procesando " + pAwayName + "...");
            var u5Away = await jalarUltimos5(pAwayId, anioMLB);
            var resultadoAway = calcularK6({
              playerId: pAwayId,
              juegosRecientes: u5Away.juegos || [],
              arsenalMaster: (typeof ARSENAL_MASTER_2026 !== "undefined") ? ARSENAL_MASTER_2026 : {},
              nombreEquipoRival: home,
              nombreUmpireNormalizado: null,
              umpiresMaster: (typeof UMPIRES_MASTER_2026 !== "undefined") ? UMPIRES_MASTER_2026 : {},
              nombreCatcher: null,
              catcherData: null,
              nombreVenue: venue,
              parkFactors: (typeof PARK_FACTORS_2026 !== "undefined") ? PARK_FACTORS_2026 : {},
              climaData: null
            });
            bloqueAway = bloquePitcherHtml(away, pAwayName, resultadoAway, lineaMercadoAway, enVivoAway);
          } catch (eAway) {
            log("ERROR procesando " + pAwayName + ": " + (eAway && eAway.message ? eAway.message : eAway));
            bloqueAway = bloquePitcherHtml(away, pAwayName, {k6_proyectado:null, k6_proyectado_preciso:null, motivo:"ERROR_AL_PROCESAR"}, lineaMercadoAway, null);
          }
        }

        // --- Pitcher de casa (home) enfrenta al lineup visitante (away) ---
        var lineaObjHome = lineasCache ? lineaPonchesBuscarPitcher(pHomeName) : null;
        var lineaMercadoHome = (lineaObjHome && lineaObjHome.total_k !== null && lineaObjHome.total_k !== undefined) ? lineaObjHome.total_k : null;
        log("Línea K de mercado para " + pHomeName + ": " + (lineaMercadoHome !== null ? lineaMercadoHome : "N/C"));

        var bloqueHome;
        if (!pHomeId) {
          bloqueHome = bloquePitcherHtml(home, "TBD", {k6_proyectado:null, k6_proyectado_preciso:null, motivo:"SIN_PITCHER_PROBABLE"}, lineaMercadoHome, null);
        } else {
          try {
            log("Procesando " + pHomeName + "...");
            var u5Home = await jalarUltimos5(pHomeId, anioMLB);
            var resultadoHome = calcularK6({
              playerId: pHomeId,
              juegosRecientes: u5Home.juegos || [],
              arsenalMaster: (typeof ARSENAL_MASTER_2026 !== "undefined") ? ARSENAL_MASTER_2026 : {},
              nombreEquipoRival: away,
              nombreUmpireNormalizado: null,
              umpiresMaster: (typeof UMPIRES_MASTER_2026 !== "undefined") ? UMPIRES_MASTER_2026 : {},
              nombreCatcher: null,
              catcherData: null,
              nombreVenue: venue,
              parkFactors: (typeof PARK_FACTORS_2026 !== "undefined") ? PARK_FACTORS_2026 : {},
              climaData: null
            });
            bloqueHome = bloquePitcherHtml(home, pHomeName, resultadoHome, lineaMercadoHome, enVivoHome);
          } catch (eHome) {
            log("ERROR procesando " + pHomeName + ": " + (eHome && eHome.message ? eHome.message : eHome));
            bloqueHome = bloquePitcherHtml(home, pHomeName, {k6_proyectado:null, k6_proyectado_preciso:null, motivo:"ERROR_AL_PROCESAR"}, lineaMercadoHome, null);
          }
        }

        // FIX: los dos pitchers del mismo juego van juntos en UNA tarjeta,
        // no en dos tarjetas separadas repitiendo el mismo matchup/parque.
        html += tarjetaJuegoHtml(away+" @ "+home, venue, bloqueAway, bloqueHome);

        // RENDER PROGRESIVO: se pinta despues de cada juego completo.
        listaEl.innerHTML = html;
      }
      log("LISTO.");
    } catch (e) {
      log("ERROR: " + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false; btn.textContent = "VER K6 NUEVO DE HOY";
    }
  });
</script>
</body>
</html>
