<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K6 · Motor Nuevo</title>
<style>
:root { color-scheme: dark; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0d1117; color:#e6edf3; }
header { padding:14px 16px; border-bottom:1px solid #30363d; }
h1 { font-size:17px; margin:0; }
main { padding:16px; max-width:900px; margin:0 auto; }
.back { color:#79c0ff; text-decoration:none; font-size:14px; margin-bottom:16px; display:block; }
.juego { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:16px; margin-top:14px; }
.matchup { font-size:18px; font-weight:800; margin-bottom:8px; }
.estadio { font-size:13px; color:#8b949e; margin:3px 0 12px; }
.pitcher-bloque { margin-top:14px; padding-top:12px; border-top:1px solid #21262d; }
.pitcher-bloque:first-of-type { border-top:none; margin-top:8px; padding-top:0; }
.pitcher-info { display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; }
.pitcher-foto { width:56px; height:56px; border-radius:50%; background:#30363d; border:2px solid #444c56; object-fit:cover; flex-shrink:0; }
.pitcher-detalles { flex:1; }
.pitcher-nombre { font-size:15px; font-weight:700; margin:0; }
.pitcher-equipo { font-size:11px; color:#8b949e; margin:2px 0 0; }
.lineas { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
.lbox { flex:1; min-width:140px; background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:12px; text-align:center; }
.lbox .lbl { font-size:10px; color:#8b949e; letter-spacing:0.5px; text-transform:uppercase; }
.lbox .val { font-size:24px; font-weight:800; margin-top:4px; color:#79c0ff; }
.lbox.nuevo .val { color:#0d8a6e; }
.lbox.mercado .val { color:#ffd60a; }
.mercado-input { background:#0d1117; border:1px solid #ffd60a; border-radius:8px; color:#ffd60a; font-size:18px; font-weight:800; padding:8px; text-align:center; width:100%; }
.mercado-input:focus { outline:none; border-color:#ffd60a; }
.badge { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:4px 10px; margin-top:8px; }
.badge.ok { background:#0d3a2c; color:#3fb950; }
.badge.warn { background:#3a2f0d; color:#ffd60a; }
.envivo-box { background:#1a0f0f; border:2px solid #ff453a; border-radius:10px; padding:14px; margin-top:12px; text-align:center; }
.envivo-titulo { font-size:10px; color:#ff9d9d; font-weight:800; margin-bottom:8px; }
.envivo-total { font-size:40px; font-weight:900; color:#fff; margin:8px 0; }
.envivo-barra { background:#21262d; height:12px; border-radius:6px; margin:14px 0; overflow:hidden; }
.envivo-barra-fill { background:linear-gradient(90deg, #3fb950, #79c0ff); height:100%; transition:width 0.3s; }
.envivo-detalles { font-size:10px; color:#ffb3ac; line-height:1.6; }
.ultimos5 { margin-top:12px; border-top:1px solid #30363d; padding-top:10px; }
.u5hdr { font-size:11px; color:#8b949e; font-weight:800; margin-bottom:8px; }
.u5row { display:flex; justify-content:space-between; font-size:12px; padding:6px 0; }
.u5row span { color:#8b949e; }
.u5row b { color:#e6edf3; font-weight:700; }
#console { margin-top:16px; background:#010409; border:1px solid #30363d; border-radius:8px; padding:12px; min-height:50px; max-height:15vh; overflow:auto; font-family:monospace; font-size:11px; color:#8b949e; }
</style>
</head>
<body>
<header><h1>K6 · Motor Nuevo (DataPro)</h1></header>
<main>
<a class="back" href="juegos-hoy.html">← Volver a juegos</a>
<div id="lista"></div>
<div id="console">Cargando...</div>
</main>

<script src="mlb-routes.js"></script>
<script src="jalar-linea-ponches.js"></script>
<script src="jalar-ultimos5.js"></script>
<script src="motor-k6-nuevo.js"></script>
<script src="jalar-ponches.js"></script>

<script>
var consoleEl = document.getElementById("console");
var listaEl = document.getElementById("lista");
function log(t){ var d=document.createElement("div"); d.textContent=t; consoleEl.appendChild(d); consoleEl.scrollTop=consoleEl.scrollHeight; }

function fotoUrl(pitcherId){
  return "https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/"+pitcherId+"/headshot/67/current";
}

function getQueryParam(param) {
  var params = new URLSearchParams(window.location.search);
  return params.get(param);
}

function bloquePitcherHtml(equipoNombre, pitcherNombre, pitcherId, resultado, lineaMercado, gamePk){
  var k6Val = resultado && resultado.k6_proyectado_preciso !== null ? resultado.k6_proyectado_preciso : "N/C";
  var k6Badge = resultado && resultado.k6_proyectado_preciso !== null
    ? '<span class="badge ok">✓ CONFIRMADO</span>'
    : '<span class="badge warn">SIN DATOS</span>';

  var fotoBg = pitcherId ? 'background-image: url(' + fotoUrl(pitcherId) + '); background-size: cover; background-position: center;' : '';

  var lineas = '<div class="lineas">'+
    '<div class="lbox nuevo"><div class="lbl">K6 DATAPRO</div><div class="val">'+k6Val+'</div></div>'+
    '<div class="lbox mercado"><div class="lbl">MI LÍNEA</div><input type="number" step="0.1" value="'+(lineaMercado||"")+'" class="mercado-input" /></div>'+
    '</div>';

  var enVivoHtml = '';
  if (gamePk && pitcherId) {
    enVivoHtml = '<div class="envivo-box" id="envivo-'+pitcherId+'">'+
      '<div class="envivo-titulo">⏱️ EN VIVO</div>'+
      '<div class="envivo-total">-</div>'+
      '</div>';
    setTimeout(function() {
      if (typeof iniciarActualizacionEnVivo === "function") {
        iniciarActualizacionEnVivo(pitcherId, gamePk, k6Val);
      }
    }, 200);
  }

  var u5html = '';
  if (resultado && resultado.base_k_real) {
    u5html = '<div class="ultimos5">'+
      '<div class="u5hdr">ÚLTIMOS STARTS ('+resultado.n_starts_usados+' usados)</div>'+
      '<div class="u5row"><span>K6 promedio</span><b>'+resultado.base_k_real+'</b></div>'+
      '</div>';
  }

  return '<div class="pitcher-bloque">'+
    '<div class="pitcher-info">'+
      '<div class="pitcher-foto" style="'+fotoBg+'"></div>'+
      '<div class="pitcher-detalles">'+
        '<div class="pitcher-nombre">'+pitcherNombre+'</div>'+
        '<div class="pitcher-equipo">'+equipoNombre+'</div>'+
      '</div>'+
    '</div>'+
    lineas + k6Badge + enVivoHtml + u5html +
    '</div>';
}

async function cargarJuego() {
  consoleEl.textContent = "";
  var gamePk = getQueryParam("gamePk");
  if (!gamePk) {
    log("ERROR: No se especificó gamePk");
    return;
  }

  try {
    log("Cargando juego " + gamePk + "...");
    
    // Llamar DIRECTO a MLB sin Worker
    var mlbUrl = "https://statsapi.mlb.com/api/v1/game/" + gamePk + "?hydrate=probablePitcher";
    var resp = await fetch(mlbUrl);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    var g = await resp.json();

    var away = (g.teams && g.teams.away && g.teams.away.team) ? g.teams.away.team.name : "?";
    var home = (g.teams && g.teams.home && g.teams.home.team) ? g.teams.home.team.name : "?";
    var venue = g.venue ? g.venue.name : "";
    
    var pAwayId = (g.teams && g.teams.away && g.teams.away.probablePitcher) ? g.teams.away.probablePitcher.id : null;
    var pAwayName = (g.teams && g.teams.away && g.teams.away.probablePitcher) ? g.teams.away.probablePitcher.fullName : "TBD";
    var pHomeId = (g.teams && g.teams.home && g.teams.home.probablePitcher) ? g.teams.home.probablePitcher.id : null;
    var pHomeName = (g.teams && g.teams.home && g.teams.home.probablePitcher) ? g.teams.home.probablePitcher.fullName : "TBD";

    log(away + " @ " + home);
    log("Líneas de mercado...");
    
    var lineaMercadoAway = null, lineaMercadoHome = null;
    try {
      await jalarLineasPonches(log);
      var lineaAway = lineaPonchesBuscarPitcher(pAwayName);
      var lineaHome = lineaPonchesBuscarPitcher(pHomeName);
      lineaMercadoAway = (lineaAway && lineaAway.total_k !== null) ? lineaAway.total_k : null;
      lineaMercadoHome = (lineaHome && lineaHome.total_k !== null) ? lineaHome.total_k : null;
    } catch (e) {
      log("Líneas: " + e.message);
    }

    log("Procesando pitchers...");
    var html = '<div class="juego">'+
      '<div class="matchup">' + away + ' @ ' + home + '</div>'+
      '<div class="estadio">⚾ ' + venue + '</div>';

    // Away
    if (pAwayId) {
      try {
        var u5Away = await jalarUltimos5(pAwayId, new Date().getFullYear());
        var resultadoAway = calcularK6({
          playerId: pAwayId,
          juegosRecientes: u5Away.juegos || [],
          arsenalMaster: (typeof ARSENAL_MASTER_2026 !== "undefined") ? ARSENAL_MASTER_2026 : {},
          nombreEquipoRival: home,
          nombreUmpireNormalizado: null,
          umpiresMaster: (typeof UMPIRES_MASTER_2026 !== "undefined") ? UMPIRES_MASTER_2026 : {},
          nombreCatcher: null,
          catcherData: null,
          nombreVenue: venue,
          parkFactors: (typeof PARK_FACTORS_2026 !== "undefined") ? PARK_FACTORS_2026 : {},
          climaData: null
        });
        html += bloquePitcherHtml(away, pAwayName, pAwayId, resultadoAway, lineaMercadoAway, gamePk);
      } catch (e) {
        log("ERROR " + pAwayName + ": " + e.message);
        html += bloquePitcherHtml(away, pAwayName, pAwayId, null, lineaMercadoAway, gamePk);
      }
    }

    // Home
    if (pHomeId) {
      try {
        var u5Home = await jalarUltimos5(pHomeId, new Date().getFullYear());
        var resultadoHome = calcularK6({
          playerId: pHomeId,
          juegosRecientes: u5Home.juegos || [],
          arsenalMaster: (typeof ARSENAL_MASTER_2026 !== "undefined") ? ARSENAL_MASTER_2026 : {},
          nombreEquipoRival: away,
          nombreUmpireNormalizado: null,
          umpiresMaster: (typeof UMPIRES_MASTER_2026 !== "undefined") ? UMPIRES_MASTER_2026 : {},
          nombreCatcher: null,
          catcherData: null,
          nombreVenue: venue,
          parkFactors: (typeof PARK_FACTORS_2026 !== "undefined") ? PARK_FACTORS_2026 : {},
          climaData: null
        });
        html += bloquePitcherHtml(home, pHomeName, pHomeId, resultadoHome, lineaMercadoHome, gamePk);
      } catch (e) {
        log("ERROR " + pHomeName + ": " + e.message);
        html += bloquePitcherHtml(home, pHomeName, pHomeId, null, lineaMercadoHome, gamePk);
      }
    }

    html += '</div>';
    listaEl.innerHTML = html;
    log("✓ LISTO");
  } catch (e) {
    log("ERROR: " + e.message);
  }
}

window.addEventListener("load", cargarJuego);
</script>
</body>
</html>
